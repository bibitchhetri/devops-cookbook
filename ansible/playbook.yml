---
- name: Setup DevOps App Server
  hosts: devops-vm
  become: yes
  vars:
    docker_image_name: "bibitkunwar/devops-app"
    docker_image_tag: "{{ lookup('env', 'DEPLOY_VERSION') | default('latest-arm64', true) }}"
    container_name: "devops-app"
    container_port: "3000"

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes
        force_apt_get: yes
      changed_when: false
      register: apt_cache_update

    - name: Install Docker
      apt:
        name: docker.io
        state: present
      register: docker_install
      failed_when: docker_install is failed and "'docker.io' is already the newest version" not in docker_install.msg|default('')

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull Docker image (ARM64)
      docker_image:
        name: "{{ docker_image_name }}"
        tag: "{{ docker_image_tag }}"
        source: pull
        force_source: yes
      register: image_pull
      until: image_pull is succeeded
      retries: 3
      delay: 5

    - name: Check if container exists
      docker_container_info:
        name: "{{ container_name }}"
      register: docker_container_exists

    - name: Remove old container if exists
      docker_container:
        name: "{{ container_name }}"
        state: absent
      when: docker_container_exists.exists | default(false)
      register: container_remove

    - name: Create and start devops-app container
      docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image_name }}:{{ docker_image_tag }}"
        state: started
        restart_policy: always
        published_ports:
          - "{{ container_port }}:{{ container_port }}"
        pull: yes
      register: container
      changed_when: container is changed

    - name: Wait for container to be healthy
      uri:
        url: "http://localhost:{{ container_port }}/health"
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 10
      delay: 3
      failed_when: false

    - name: Debug - Show health check result
      debug:
        msg: "Container health check: {{ 'UP' if health_check.status == 200 else 'DOWN - Manual intervention needed' }}"
      when: health_check is defined
