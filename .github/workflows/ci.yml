name: Node.js CI & Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '22'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get short commit SHA
      id: sha
      run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

    - name: Extract version from package.json
      id: version
      run: |
        VERSION=$(node -p "require('./package.json').version")
        echo "app_version=$VERSION" >> $GITHUB_OUTPUT

    - name: Set up QEMU for multi-platform builds
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test || echo "No tests defined"

    - name: Login to GHCR (GitHub Container Registry)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up tags for Docker Hub
      id: dockerhub-tags
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "tags=bibitkunwar/devops-app:${{ steps.version.outputs.app_version }}-arm64\nbibitkunwar/devops-app:${{ steps.version.outputs.app_version }}-amd64\nbibitkunwar/devops-app:${{ steps.sha.outputs.short_sha }}-arm64\nbibitkunwar/devops-app:${{ steps.sha.outputs.short_sha }}-amd64\nbibitkunwar/devops-app:latest" >> $GITHUB_OUTPUT

    - name: Build and push multi-platform Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/arm64,linux/amd64
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: |
          ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.app_version }}-arm64
          ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.app_version }}-amd64
          ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short_sha }}-arm64
          ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short_sha }}-amd64
          ghcr.io/${{ env.IMAGE_NAME }}:latest-arm64
          ${{ steps.dockerhub-tags.outputs.tags }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
        build-args: |
          NODE_VERSION=${{ env.NODE_VERSION }}

    - name: Move cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

