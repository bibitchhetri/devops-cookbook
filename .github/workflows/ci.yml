name: Node.js CI & Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout your code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # 3. Install dependencies
    - name: Install dependencies
      run: npm install

    # 4. Run tests (optional)
    - name: Run tests
      run: npm test || echo "No tests defined"

    # 5. Build Docker image
    - name: Build Docker image
      run: docker build -t devops-app:latest .

    # 6. Log in to Docker Hub (only on main branch push)
    - name: Docker login
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 7. Tag & push Docker image (only on main branch push)
    - name: Push Docker image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker tag devops-app:latest bibitkunwar/devops-app:latest
        docker push bibitkunwar/devops-app:latest

